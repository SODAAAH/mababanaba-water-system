<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#ffffff; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="decisionShadow" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>

    <style>
      .lane-header { font-size: 15px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
      .node-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .node-subtitle { font-size: 10.5px; font-weight: 500; fill: #64748b; }
      .decision-text { font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .edge-label { font-size: 10px; font-weight: 700; fill: #334155; font-family: monospace; }
      .conn-line { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .conn-line-dashed { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 4 3; stroke-linecap: round; }
      .conn-line-rose { fill: none; stroke: #e11d48; stroke-width: 1.8; stroke-linecap: round; }
      .conn-line-emerald { fill: none; stroke: #059669; stroke-width: 1.8; stroke-linecap: round; }
      .conn-line-blue { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; }
      .conn-line-purple { fill: none; stroke: #7c3aed; stroke-width: 1.8; stroke-linecap: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#f8fafc"/>

  <!-- Title & Header Banner -->
  <g transform="translate(60, 30)">
    <text x="0" y="24" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">END-TO-END SYSTEM SWIMLANE PROCESS FLOWCHART</text>
    <text x="0" y="44" font-size="12" font-weight="500" fill="#64748b">Mababanaba Waters System — Cross-Functional Workflow Across Customer, Station Admin, Delivery Staff, and ACID System Engine</text>
  </g>

  <!-- 4 Horizontal Swimlanes -->
  <!-- Lane 1: Customer (Blue) -->
  <g transform="translate(50, 90)">
    <rect width="1820" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="180" height="225" rx="8" fill="#eff6ff"/>
    <rect x="172" width="8" height="225" fill="#eff6ff"/>
    <line x1="180" y1="0" x2="180" y2="225" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="90" y="105" text-anchor="middle" class="lane-header" fill="#1e40af">CUSTOMER</text>
    <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#3b82f6">PWA Client</text>
  </g>

  <!-- Lane 2: Station Admin (Purple) -->
  <g transform="translate(50, 330)">
    <rect width="1820" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="180" height="225" rx="8" fill="#faf5ff"/>
    <rect x="172" width="8" height="225" fill="#faf5ff"/>
    <line x1="180" y1="0" x2="180" y2="225" stroke="#e9d5ff" stroke-width="1.2"/>
    <text x="90" y="105" text-anchor="middle" class="lane-header" fill="#6b21a8">STATION ADMIN</text>
    <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#9333ea">Operations Desk</text>
  </g>

  <!-- Lane 3: Delivery Staff / Rider (Amber) -->
  <g transform="translate(50, 570)">
    <rect width="1820" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="180" height="225" rx="8" fill="#fffbeb"/>
    <rect x="172" width="8" height="225" fill="#fffbeb"/>
    <line x1="180" y1="0" x2="180" y2="225" stroke="#fde68a" stroke-width="1.2"/>
    <text x="90" y="105" text-anchor="middle" class="lane-header" fill="#92400e">DELIVERY RIDER</text>
    <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">Mobile Rider Portal</text>
  </g>

  <!-- Lane 4: Database & System Engine (Slate / Indigo) -->
  <g transform="translate(50, 810)">
    <rect width="1820" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="180" height="225" rx="8" fill="#f1f5f9"/>
    <rect x="172" width="8" height="225" fill="#f1f5f9"/>
    <line x1="180" y1="0" x2="180" y2="225" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="90" y="105" text-anchor="middle" class="lane-header" fill="#334155">SYSTEM / DB</text>
    <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">ACID &amp; Background Cron</text>
  </g>

  <!-- Connectors in Master Flow -->
  <!-- C1 -> C2 -->
  <path d="M 370 180 L 405 180" class="conn-line" marker-end="url(#arrow)"/>
  <!-- C2 -> C3 -->
  <path d="M 545 180 L 580 180" class="conn-line" marker-end="url(#arrow)"/>
  <!-- C3 -> D1 (Checkout triggers inventory lock down to Lane 4) -->
  <path d="M 650 215 L 650 860" class="conn-line-blue" marker-end="url(#arrowBlue)"/>
  <!-- D1 Decision: In stock? -->
  <!-- D1 -> C3 (No, Insufficient Stock) -->
  <path d="M 600 895 L 560 895 L 560 215 L 610 215" class="conn-line-rose" marker-end="url(#arrowRose)"/>
  <!-- D1 -> S1 (Yes, Order Pending created in Lane 2) -->
  <path d="M 700 895 L 750 895 L 750 420 L 785 420" class="conn-line-emerald" marker-end="url(#arrowEmerald)"/>

  <!-- S1 -> S_DEC (Admin Review Decision) -->
  <path d="M 925 420 L 960 420" class="conn-line" marker-end="url(#arrow)"/>
  <!-- S_DEC -> S_REJ (Cancel / Reject) -->
  <path d="M 1010 390 L 1010 350 L 1070 350" class="conn-line-rose" marker-end="url(#arrowRose)"/>
  <!-- S_REJ -> D_RESTORE (Rollback stock down to DB) -->
  <path d="M 1210 350 L 1260 350 L 1260 860" class="conn-line-rose" marker-end="url(#arrowRose)"/>

  <!-- S_DEC -> S2 (Accept -> Preparing) -->
  <path d="M 1060 420 L 1100 420" class="conn-line-emerald" marker-end="url(#arrowEmerald)"/>
  <!-- S2 -> S3 (Assign Rider -> To Deliver) -->
  <path d="M 1240 420 L 1280 420" class="conn-line" marker-end="url(#arrow)"/>
  <!-- S3 -> R1 (Dispatches to Rider in Lane 3) -->
  <path d="M 1350 455 L 1350 635" class="conn-line-purple" marker-end="url(#arrowPurple)"/>

  <!-- R1 -> R2 (In Transit / En Route) -->
  <path d="M 1420 660 L 1460 660" class="conn-line" marker-end="url(#arrow)"/>
  <!-- R2 -> R_DEC (Inspect Jug Exchange at Doorstep) -->
  <path d="M 1580 660 L 1610 660" class="conn-line" marker-end="url(#arrow)"/>
  <!-- R_DEC -> R_DEBT (No empty jug -> Dynamic Swap-to-Borrow Debt Conversion) -->
  <path d="M 1660 630 L 1660 595 L 1710 595" class="conn-line-rose" marker-end="url(#arrowRose)"/>
  <!-- R_DEC -> R3 (Delivered successfully) -->
  <path d="M 1660 690 L 1660 725 L 1710 725" class="conn-line-emerald" marker-end="url(#arrowEmerald)"/>
  <!-- R_DEBT & R3 converge to DB Loyalty & Stock finalization -->
  <path d="M 1780 725 L 1810 725 L 1810 885 L 1740 885" class="conn-line-emerald" marker-end="url(#arrowEmerald)"/>
  <!-- DB Push Notification to Customer C4 Review -->
  <path d="M 1600 885 L 1520 885 L 1520 215 L 1450 215" class="conn-line-blue" marker-end="url(#arrowBlue)"/>

  <!-- Cron 5-min timeout auto-cancel (Lane 4) -->
  <path d="M 855 860 L 855 830 L 1000 830 L 1000 860" class="conn-line-dashed" marker-end="url(#arrow)"/>

  <!-- NODES: LANE 1 - CUSTOMER -->
  <!-- Start Terminal -->
  <g transform="translate(250, 150)">
    <rect width="120" height="60" rx="30" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="28" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Start / Auth</text>
    <text x="60" y="44" font-size="10" font-weight="500" fill="#bfdbfe" text-anchor="middle">SMS OTP Login</text>
  </g>

  <!-- Browse & Select Products -->
  <g transform="translate(405, 145)">
    <rect width="140" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="140" height="6" rx="3" fill="#2563eb"/>
    <text x="15" y="27" class="node-title">Product Catalog</text>
    <text x="15" y="43" class="node-subtitle">Select Jug Type</text>
    <text x="15" y="57" class="node-subtitle">Swap / Borrow / Buy</text>
  </g>

  <!-- Checkout & Payment -->
  <g transform="translate(580, 145)">
    <rect width="140" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="140" height="6" rx="3" fill="#2563eb"/>
    <text x="15" y="27" class="node-title">Checkout &amp; Pay</text>
    <text x="15" y="43" class="node-subtitle">COD / GCash / Maya</text>
    <text x="15" y="57" class="node-subtitle">Redeem Points</text>
  </g>

  <!-- Customer Post-Delivery Feedback -->
  <g transform="translate(1330, 150)">
    <rect width="120" height="60" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="120" height="6" rx="3" fill="#059669"/>
    <text x="15" y="26" class="node-title">Rate &amp; Review</text>
    <text x="15" y="42" class="node-subtitle">1 to 5 Stars</text>
  </g>

  <!-- NODES: LANE 2 - STATION ADMIN -->
  <!-- Admin Order Queue -->
  <g transform="translate(785, 385)">
    <rect width="140" height="70" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="140" height="6" rx="3" fill="#7c3aed"/>
    <text x="15" y="27" class="node-title">Order Queue</text>
    <text x="15" y="43" class="node-subtitle">Pending Review</text>
    <text x="15" y="57" class="node-subtitle">Verify GCash/Maya</text>
  </g>

  <!-- Admin Decision Diamond -->
  <g transform="translate(0, 0)">
    <polygon points="1010,380 1060,420 1010,460 960,420" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#decisionShadow)"/>
    <text x="1010" y="418" class="decision-text">Valid</text>
    <text x="1010" y="430" class="decision-text">Order?</text>
    <text x="1075" y="414" class="edge-label" fill="#059669">YES</text>
    <text x="1015" y="365" class="edge-label" fill="#e11d48">NO</text>
  </g>

  <!-- Order Rejected / Cancelled -->
  <g transform="translate(1070, 325)">
    <rect width="140" height="50" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="15" y="23" class="node-title" fill="#be123c">Order Cancelled</text>
    <text x="15" y="37" class="node-subtitle" fill="#e11d48">Stock Restored</text>
  </g>

  <!-- Order Accepted -> Preparing -->
  <g transform="translate(1100, 385)">
    <rect width="140" height="70" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="140" height="6" rx="3" fill="#7c3aed"/>
    <text x="15" y="27" class="node-title">Preparing Order</text>
    <text x="15" y="43" class="node-subtitle">Sanitize &amp; Refill</text>
    <text x="15" y="57" class="node-subtitle">Receipt Generated</text>
  </g>

  <!-- Assign Delivery Staff -->
  <g transform="translate(1280, 385)">
    <rect width="140" height="70" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="140" height="6" rx="3" fill="#7c3aed"/>
    <text x="15" y="27" class="node-title">Assign Rider</text>
    <text x="15" y="43" class="node-subtitle">Status: To Deliver</text>
    <text x="15" y="57" class="node-subtitle">DELIVERIES Record</text>
  </g>

  <!-- NODES: LANE 3 - DELIVERY RIDER -->
  <!-- Rider Receives Dispatch -->
  <g transform="translate(1280, 635)">
    <rect width="140" height="60" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="140" height="6" rx="3" fill="#d97706"/>
    <text x="15" y="25" class="node-title">Receive Dispatch</text>
    <text x="15" y="41" class="node-subtitle">View Delivery Info</text>
  </g>

  <!-- Rider Out For Delivery -->
  <g transform="translate(1460, 630)">
    <rect width="120" height="60" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="120" height="6" rx="3" fill="#d97706"/>
    <text x="15" y="25" class="node-title">Deliver to Door</text>
    <text x="15" y="41" class="node-subtitle">Collect COD Cash</text>
  </g>

  <!-- Inspect Jug Return Decision -->
  <g transform="translate(0, 0)">
    <polygon points="1635,630 1685,660 1635,690 1585,660" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#decisionShadow)"/>
    <text x="1635" y="658" class="decision-text">Empty Jug</text>
    <text x="1635" y="670" class="decision-text">Returned?</text>
    <text x="1690" y="655" class="edge-label" fill="#059669">YES</text>
    <text x="1635" y="618" class="edge-label" fill="#e11d48">NO</text>
  </g>

  <!-- Dynamic Swap to Borrow Conversion -->
  <g transform="translate(1710, 570)">
    <rect width="130" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="15" y="22" class="node-title" fill="#b45309">Convert to Borrow</text>
    <text x="15" y="36" class="node-subtitle">Log Jug Debt Balance</text>
  </g>

  <!-- Successful Delivery -->
  <g transform="translate(1710, 700)">
    <rect width="130" height="50" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="15" y="22" class="node-title" fill="#047857">Order Delivered</text>
    <text x="15" y="36" class="node-subtitle">Fulfillment Done</text>
  </g>

  <!-- NODES: LANE 4 - DATABASE & SYSTEM ENGINE -->
  <!-- ACID Concurrency & Stock Lock -->
  <g transform="translate(600, 860)">
    <rect width="150" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="150" height="6" rx="3" fill="#4338ca"/>
    <text x="15" y="25" class="node-title">ACID Inventory Lock</text>
    <text x="15" y="41" class="node-subtitle">FOR UPDATE Row Lock</text>
    <text x="15" y="55" class="node-subtitle">Check Stock &gt;= Qty</text>
  </g>

  <!-- 5-min Cron Auto Cancel -->
  <g transform="translate(800, 860)">
    <rect width="150" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="150" height="6" rx="3" fill="#64748b"/>
    <text x="15" y="25" class="node-title">5-Min Cron Timeout</text>
    <text x="15" y="41" class="node-subtitle">Auto-cancel unaccepted</text>
    <text x="15" y="55" class="node-subtitle">Atomic stock rollback</text>
  </g>

  <!-- Stock Rollback & Restitution -->
  <g transform="translate(1200, 860)">
    <rect width="140" height="70" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="140" height="6" rx="3" fill="#e11d48"/>
    <text x="15" y="25" class="node-title" fill="#be123c">Rollback Stock</text>
    <text x="15" y="41" class="node-subtitle">Replenish Inventory</text>
    <text x="15" y="55" class="node-subtitle">Refund Points Used</text>
  </g>

  <!-- Loyalty Accrual & Tier Promotion -->
  <g transform="translate(1600, 860)">
    <rect width="150" height="70" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="150" height="6" rx="3" fill="#059669"/>
    <text x="15" y="25" class="node-title" fill="#047857">Loyalty Engine</text>
    <text x="15" y="41" class="node-subtitle">+2 Redeem / +3 Lifetime</text>
    <text x="15" y="55" class="node-subtitle">Auto Tier Promotion</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1420, 35)">
    <rect width="450" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="20" cy="20" r="5" fill="#2563eb"/><text x="32" y="24" font-size="11" font-weight="600" fill="#334155">Customer</text>
    <circle cx="110" cy="20" r="5" fill="#7c3aed"/><text x="122" y="24" font-size="11" font-weight="600" fill="#334155">Station Admin</text>
    <circle cx="225" cy="20" r="5" fill="#d97706"/><text x="237" y="24" font-size="11" font-weight="600" fill="#334155">Delivery Rider</text>
    <circle cx="340" cy="20" r="5" fill="#059669"/><text x="352" y="24" font-size="11" font-weight="600" fill="#334155">Delivered / DB</text>
  </g>
</svg>
