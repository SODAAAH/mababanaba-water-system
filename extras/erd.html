<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entity-Relationship Diagram (ERD) — Mababanaba Waters System</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }
    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }
    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #f8fafc;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #1e293b;
      border-color: #475569;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #1d4ed8;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-emerald {
      background: #059669;
      border-color: #047857;
      color: #ffffff;
    }
    .btn-emerald:hover {
      background: #047857;
    }
    .viewport {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .diagram-card {
      width: 100%;
      max-width: 1720px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      overflow: hidden;
    }
    .diagram-card svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #059669;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <header class="toolbar">
    <div class="brand">
      <div class="brand-icon">ERD</div>
      <div class="brand-text">
        <h1>Mababanaba Waters System — ERD Diagram</h1>
        <p>16:9 Landscape Widescreen (Capstone Presentation &amp; Paper)</p>
      </div>
    </div>

    <div class="actions">
      <button id="btnDownloadSvg" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download SVG
      </button>

      <button id="btnDownloadPng" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        Download 1080p PNG
      </button>

      <button id="btnDownloadPng4K" class="btn btn-emerald">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Download 4K UHD PNG
      </button>

      <button id="btnFullscreen" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        Fullscreen
      </button>
    </div>
  </header>

  <main class="viewport">
    <div class="diagram-card" id="diagramContainer">
      <svg id="erdSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#ffffff; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <defs>
          <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
          </filter>

          <marker id="crowZeroMany" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto">
            <circle cx="4" cy="7" r="3" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
            <path d="M 8,7 L 16,7 M 16,1 L 9,7 L 16,13" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>

          <marker id="oneOnly" markerWidth="12" markerHeight="14" refX="2" refY="7" orient="auto">
            <line x1="4" y1="1" x2="4" y2="13" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="9" y1="1" x2="9" y2="13" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
          </marker>

          <marker id="crowOneMany" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto">
            <line x1="3" y1="1" x2="3" y2="13" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M 4,7 L 16,7 M 16,1 L 8,7 L 16,13" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>

          <marker id="zeroOne" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
            <circle cx="4" cy="7" r="3" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
            <line x1="10" y1="1" x2="10" y2="13" stroke="#475569" stroke-width="1.6" stroke-linecap="round"/>
          </marker>

          <style>
            .entity-title { font-size: 15px; font-weight: 700; fill: #ffffff; letter-spacing: 0.04em; }
            .field-name { font-size: 12px; font-weight: 600; fill: #1e293b; }
            .field-type { font-size: 11px; font-weight: 500; fill: #64748b; font-family: 'JetBrains Mono', Consolas, monospace; }
            .pk-badge { fill: #fef3c7; stroke: #d97706; stroke-width: 1; }
            .pk-text { font-size: 9px; font-weight: 800; fill: #92400e; font-family: monospace; }
            .fk-badge { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1; }
            .fk-text { font-size: 9px; font-weight: 800; fill: #0369a1; font-family: monospace; }
            .comp-badge { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1; }
            .comp-text { font-size: 8.5px; font-weight: 800; fill: #6b21a8; font-family: monospace; }
            .line { fill: none; stroke: #475569; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
          </style>
        </defs>

        <rect x="0" y="0" width="1920" height="1080" fill="#f8fafc"/>

        <!-- Connector Lines -->

        <path d="M 240 320 L 240 430" class="line" marker-start="url(#oneOnly)" marker-end="url(#crowZeroMany)"/>
        <path d="M 660 420 L 660 490" class="line" marker-start="url(#oneOnly)" marker-end="url(#crowZeroMany)"/>
        <path d="M 660 720 L 660 780" class="line" marker-start="url(#oneOnly)" marker-end="url(#oneOnly)"/>
        <path d="M 850 130 L 910 130" class="line" marker-start="url(#oneOnly)" marker-end="url(#crowZeroMany)"/>
        <path d="M 1420 150 L 1360 150" class="line" marker-start="url(#oneOnly)" marker-end="url(#crowZeroMany)"/>
        <path d="M 850 560 L 880 560 L 880 360 L 910 360" class="line" marker-start="url(#oneOnly)" marker-end="url(#crowZeroMany)"/>

            <g transform="translate(0, 30)"><rect x="0" y="-11" width="22" height="14" rx="2" class="fk-badge"/><text x="11" y="0" class="fk-text" text-anchor="middle">FK</text><text x="28" y="0" class="field-name">station_id</text><text x="308" y="0" class="field-type" text-anchor="end">INT (NULL)</text></g>

        <!-- 3. STATION -->
        <g transform="translate(470, 40)" filter="url(#shadow)">

            <g transform="translate(0, 168)"><text x="28" y="0" class="field-name">shipping_fee</text><text x="348" y="0" class="field-type" text-anchor="end">DECIMAL(10,2)</text></g>

        <!-- 6. ORDERS -->
        <g transform="translate(910, 40)" filter="url(#shadow)">
          <rect width="450" height="530" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

          <text x="16" y="26" class="entity-title">ORDERS</text>
          <g transform="translate(16, 62)">

            <g transform="translate(0, 26)"><rect x="0" y="-11" width="22" height="14" rx="2" class="fk-badge"/><text x="11" y="0" class="fk-text" text-anchor="middle">FK</text><text x="28" y="0" class="field-name">station_id</text><text x="418" y="0" class="field-type" text-anchor="end">INT</text></g>

            <g transform="translate(0, 78)"><rect x="0" y="-11" width="22" height="14" rx="2" class="fk-badge"/><text x="11" y="0" class="fk-text" text-anchor="middle">FK</text><text x="28" y="0" class="field-name">product_id</text><text x="418" y="0" class="field-type" text-anchor="end">INT</text></g>
            <g transform="translate(0, 104)"><text x="28" y="0" class="field-name">station_order_number</text><text x="418" y="0" class="field-type" text-anchor="end">INT</text></g>
            <g transform="translate(0, 130)"><text x="28" y="0" class="field-name">order_status</text><text x="418" y="0" class="field-type" text-anchor="end">ENUM</text></g>
            <g transform="translate(0, 156)"><text x="28" y="0" class="field-name">quantity</text><text x="418" y="0" class="field-type" text-anchor="end">INT</text></g>
            <g transform="translate(0, 182)"><text x="28" y="0" class="field-name">total_price</text><text x="418" y="0" class="field-type" text-anchor="end">DECIMAL(10,2)</text></g>

  <div class="toast" id="toast">Exporting...</div>

  <script>
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function getSvgString() {
      const svg = document.getElementById('erdSvg');
      return new XMLSerializer().serializeToString(svg);
    }

    // Direct Download Vector SVG
    document.getElementById('btnDownloadSvg').addEventListener('click', () => {
      try {
        const svgText = getSvgString();
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Mababanaba_Waters_ERD_16x9.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Vector SVG downloaded');
      } catch (err) {
        alert('Could not download SVG: ' + err.message);
      }
    });

    // Rasterize SVG to PNG at target resolution
    function downloadPngAtResolution(width, height, filename) {
      showToast('Exporting ' + width + 'x' + height + ' PNG...');
      try {
        const svgText = getSvgString();
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = new Image();

        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);

          canvas.toBlob((pngBlob) => {
            const pngUrl = URL.createObjectURL(pngBlob);
            const a = document.createElement('a');
            a.href = pngUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(pngUrl);
            showToast('Downloaded ' + filename);
          }, 'image/png');
        };
        img.src = url;
      } catch (err) {
        alert('Could not export PNG: ' + err.message);
      }
    }

    document.getElementById('btnDownloadPng').addEventListener('click', () => {
      downloadPngAtResolution(1920, 1080, 'Mababanaba_Waters_ERD_1080p_16x9.png');
    });

    document.getElementById('btnDownloadPng4K').addEventListener('click', () => {
      downloadPngAtResolution(3840, 2160, 'Mababanaba_Waters_ERD_4K_16x9.png');
    });

    document.getElementById('btnFullscreen').addEventListener('click', () => {
      const container = document.getElementById('diagramContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          alert('Error enabling fullscreen: ' + err.message);
        });
      } else {
        document.exitFullscreen();
      }
    });
  </script>
