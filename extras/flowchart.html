<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Flowchart — Mababanaba Waters System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --panel-bg: #1f2937;
      --border: #374151;
      --border-subtle: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --emerald: #059669;
      --emerald-hover: #047857;
      --amber: #d97706;
      --rose: #e11d48;
      --purple: #7c3aed;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Tabs */
    .tab-nav {
      display: flex;
      background: #0b0f19;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .tab-btn {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      color: #ffffff;
      background: #1f2937;
    }
    .tab-btn.active {
      color: #ffffff;
      background: #2563eb;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #111827;
      color: #f9fafb;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #1f2937;
      border-color: #4b5563;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #1d4ed8;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-emerald {
      background: #059669;
      border-color: #047857;
      color: #ffffff;
    }
    .btn-emerald:hover {
      background: #047857;
    }
    .btn-icon-only {
      padding: 8px;
    }

    /* Main Viewport */
    .viewport {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .canvas-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      align-self: flex-end;
    }
    .canvas-btn {
      background: #1f2937;
      border: 1px solid var(--border);
      color: #e5e7eb;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .canvas-btn:hover {
      background: #374151;
    }
    .zoom-text {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      min-width: 44px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }

    .diagram-card {
      width: 100%;
      max-width: 1720px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      border: 1px solid #374151;
      overflow: hidden;
      position: relative;
      cursor: grab;
      user-select: none;
    }
    .diagram-card.grabbing {
      cursor: grabbing;
    }
    .diagram-card svg {
      width: 100%;
      height: 100%;
      display: block;
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
    }

    /* Details Drawer */
    .details-drawer {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 380px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 60;
      animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #374151;
    }
    .drawer-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }
    .drawer-close {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }
    .drawer-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .drawer-desc {
      font-size: 12px;
      color: #d1d5db;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .drawer-meta {
      font-size: 11px;
      color: #9ca3af;
      border-top: 1px dashed #374151;
      padding-top: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: #059669;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 100;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    /* SVG node styles */
    .flow-node {
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    .flow-node:hover {
      filter: drop-shadow(0 0 6px rgba(37, 99, 235, 0.45));
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Actions Toolbar -->
  <header class="toolbar">
    <div class="brand">
      <div class="brand-icon">FLW</div>
      <div class="brand-text">
        <h1>Mababanaba Waters System — Architectural Flowcharts</h1>
        <p>16:9 Landscape Widescreen (Capstone Presentation &amp; Manuscript)</p>
      </div>
    </div>

    <!-- View Tabs -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-view="master">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        1. End-to-End Swimlane
      </button>
      <button class="tab-btn" data-view="ordering">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        2. Order &amp; ACID Concurrency
      </button>
      <button class="tab-btn" data-view="logistics">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1"/><path d="M18 8h4a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-4"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg>
        3. Dynamic Debt &amp; Delivery
      </button>
      <button class="tab-btn" data-view="lifecycle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        4. State Machine &amp; Cron
      </button>
    </nav>

    <!-- Export & Tools -->
    <div class="actions">
      <button id="btnDownloadSvg" class="btn" title="Download standalone vector graphic">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download SVG
      </button>

      <button id="btnDownloadPng" class="btn btn-primary" title="Export high-resolution PNG for slides">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        Download 1080p PNG
      </button>

      <button id="btnDownloadPng4K" class="btn btn-emerald" title="Export Ultra-HD 4K PNG for paper manuscript">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Download 4K PNG
      </button>

      <button id="btnFullscreen" class="btn btn-icon-only" title="Toggle Fullscreen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </header>

  <!-- Interactive Diagram Canvas Area -->
  <main class="viewport">
    <div class="canvas-controls">
      <button id="btnZoomOut" class="canvas-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <span id="zoomLevel" class="zoom-text">100%</span>
      <button id="btnZoomIn" class="canvas-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <button id="btnZoomReset" class="canvas-btn">Reset</button>
    </div>

    <div class="diagram-card" id="diagramContainer">
      <!-- Embedded 16:9 Vector SVG Container -->
      <svg id="flowchartSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#ffffff; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <defs>
          <!-- Subtle Card Shadows -->
          <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
          </filter>
          <filter id="decisionShadow" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07"/>
          </filter>

          <!-- Marker Arrowheads -->
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
          </marker>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
          </marker>
          <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
          </marker>
          <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
          </marker>
          <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
          </marker>

          <!-- CSS in SVG -->
          <style>
            .lane-header { font-size: 15px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
            .node-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
            .node-subtitle { font-size: 10.5px; font-weight: 500; fill: #64748b; }
            .node-badge { font-size: 9px; font-weight: 800; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
            .decision-text { font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
            .edge-label { font-size: 10px; font-weight: 700; fill: #334155; font-family: 'JetBrains Mono', monospace; }
            .conn-line { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
            .conn-line-dashed { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 4 3; stroke-linecap: round; }
            .conn-line-rose { fill: none; stroke: #e11d48; stroke-width: 1.8; stroke-linecap: round; }
            .conn-line-emerald { fill: none; stroke: #059669; stroke-width: 1.8; stroke-linecap: round; }
            .conn-line-blue { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; }
          </style>
        </defs>

        <!-- VIEW GROUP: Dynamic SVG contents swapped by Javascript -->
        <g id="svgContentRoot"></g>
      </svg>
    </div>

    <!-- Interactive Node Inspector Drawer -->
    <div class="details-drawer" id="detailsDrawer">
      <div class="drawer-header">
        <span class="drawer-title" id="drawerTitle">Node Details</span>
        <button class="drawer-close" id="drawerClose">&times;</button>
      </div>
      <div id="drawerBadge" class="drawer-badge" style="background:#dbeafe; color:#1e40af;">Customer Process</div>
      <p class="drawer-desc" id="drawerDesc">Detailed description of this step in the workflow.</p>
      <div class="drawer-meta" id="drawerMeta">Controller: api/controllers/CustomerController.php</div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toastMessage">Vector SVG downloaded</div>
  </main>

  <script>
    // VIEW 1: Master Cross-Functional Swimlane Flowchart
    const viewMaster = `
      <rect x="0" y="0" width="1920" height="1080" fill="#f8fafc"/>

      <!-- Title & Header Banner -->
      <g transform="translate(60, 30)">
        <text x="0" y="24" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">END-TO-END SYSTEM SWIMLANE PROCESS FLOWCHART</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#64748b">Cross-functional workflow across Customer, Station Admin, Delivery Staff (Riders), and System Engine / Database</text>
      </g>

      <!-- 4 Horizontal Swimlanes -->
      <!-- Lane 1: Customer (Blue) -->
      <g transform="translate(50, 90)">
        <rect width="1820" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect width="180" height="225" rx="8" fill="#eff6ff"/>
        <rect x="172" width="8" height="225" fill="#eff6ff"/>
        <line x1="180" y1="0" x2="180" y2="225" stroke="#bfdbfe" stroke-width="1.2"/>
        <text x="90" y="105" text-anchor="middle" class="lane-header" fill="#1e40af">CUSTOMER</text>
        <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#3b82f6">PWA Client</text>
      </g>

      <!-- Lane 2: Station Admin (Purple) -->
      <g transform="translate(50, 330)">
        <rect width="1820" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect width="180" height="225" rx="8" fill="#faf5ff"/>
        <rect x="172" width="8" height="225" fill="#faf5ff"/>
        <line x1="180" y1="0" x2="180" y2="225" stroke="#e9d5ff" stroke-width="1.2"/>
        <text x="90" y="105" text-anchor="middle" class="lane-header" fill="#6b21a8">STATION ADMIN</text>
        <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#9333ea">Operations Desk</text>
      </g>

      <!-- Lane 3: Delivery Staff / Rider (Amber) -->
      <g transform="translate(50, 570)">
        <rect width="1820" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect width="180" height="225" rx="8" fill="#fffbeb"/>
        <rect x="172" width="8" height="225" fill="#fffbeb"/>
        <line x1="180" y1="0" x2="180" y2="225" stroke="#fde68a" stroke-width="1.2"/>
        <text x="90" y="105" text-anchor="middle" class="lane-header" fill="#92400e">DELIVERY RIDER</text>
        <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">Mobile Rider Portal</text>
      </g>

      <!-- Lane 4: Database & System Engine (Slate / Indigo) -->
      <g transform="translate(50, 810)">
        <rect width="1820" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect width="180" height="225" rx="8" fill="#f1f5f9"/>
        <rect x="172" width="8" height="225" fill="#f1f5f9"/>
        <line x1="180" y1="0" x2="180" y2="225" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="90" y="105" text-anchor="middle" class="lane-header" fill="#334155">SYSTEM / DB</text>
        <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">ACID &amp; Background Cron</text>
      </g>

      <!-- Connectors in Master Flow -->
      <!-- C1 -> C2 -->
      <path d="M 370 180 L 405 180" class="conn-line" marker-end="url(#arrow)"/>
      <!-- C2 -> C3 -->
      <path d="M 545 180 L 580 180" class="conn-line" marker-end="url(#arrow)"/>
      <!-- C3 -> D1 (Checkout triggers inventory lock down to Lane 4) -->
      <path d="M 650 215 L 650 860" class="conn-line-blue" marker-end="url(#arrowBlue)"/>
      <!-- D1 Decision: In stock? -->
      <!-- D1 -> C3 (No, Insufficient Stock) -->
      <path d="M 600 895 L 560 895 L 560 215 L 610 215" class="conn-line-rose" marker-end="url(#arrowRose)"/>
      <!-- D1 -> S1 (Yes, Order Pending created in Lane 2) -->
      <path d="M 700 895 L 750 895 L 750 420 L 785 420" class="conn-line-emerald" marker-end="url(#arrowEmerald)"/>

      <!-- S1 -> S_DEC (Admin Review Decision) -->
      <path d="M 925 420 L 960 420" class="conn-line" marker-end="url(#arrow)"/>
      <!-- S_DEC -> S_REJ (Cancel / Reject) -->
      <path d="M 1010 390 L 1010 350 L 1070 350" class="conn-line-rose" marker-end="url(#arrowRose)"/>
      <!-- S_REJ -> D_RESTORE (Rollback stock down to DB) -->
      <path d="M 1210 350 L 1260 350 L 1260 860" class="conn-line-rose" marker-end="url(#arrowRose)"/>

      <!-- S_DEC -> S2 (Accept -> Preparing) -->
      <path d="M 1060 420 L 1100 420" class="conn-line-emerald" marker-end="url(#arrowEmerald)"/>
      <!-- S2 -> S3 (Assign Rider -> To Deliver) -->
      <path d="M 1240 420 L 1280 420" class="conn-line" marker-end="url(#arrow)"/>
      <!-- S3 -> R1 (Dispatches to Rider in Lane 3) -->
      <path d="M 1350 455 L 1350 635" class="conn-line-purple" marker-end="url(#arrowPurple)"/>

      <!-- R1 -> R2 (In Transit / En Route) -->
      <path d="M 1420 660 L 1460 660" class="conn-line" marker-end="url(#arrow)"/>
      <!-- R2 -> R_DEC (Inspect Jug Exchange at Doorstep) -->
      <path d="M 1580 660 L 1610 660" class="conn-line" marker-end="url(#arrow)"/>
      <!-- R_DEC -> R_DEBT (No empty jug -> Dynamic Swap-to-Borrow Debt Conversion) -->
      <path d="M 1660 630 L 1660 595 L 1710 595" class="conn-line-rose" marker-end="url(#arrowRose)"/>
      <!-- R_DEC -> R3 (Delivered successfully) -->
      <path d="M 1660 690 L 1660 725 L 1710 725" class="conn-line-emerald" marker-end="url(#arrowEmerald)"/>
      <!-- R_DEBT & R3 converge to DB Loyalty & Stock finalization -->
      <path d="M 1780 725 L 1810 725 L 1810 885 L 1740 885" class="conn-line-emerald" marker-end="url(#arrowEmerald)"/>
      <!-- DB Push Notification to Customer C4 Review -->

      <g class="flow-node" data-title="Automated Cron Expired Orders Scanner" data-badge="Automated Cron" data-desc="Cron worker triggers OrderHelper::autoCancelExpiredOrders(). Detects Pending orders older than 300 seconds without station acceptance." data-meta="api/cron.php -> OrderHelper.php">
        <rect x="680" y="180" width="180" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#cardShadow)"/>
        <text x="770" y="210" class="node-title" text-anchor="middle" fill="#475569">Cron 5-Min Scanner</text>
        <text x="770" y="228" class="node-subtitle" text-anchor="middle">order_date &lt; NOW() - 300s</text>
        <text x="770" y="244" class="node-subtitle" text-anchor="middle">Unaccepted order timeout</text>
      </g>

      <!-- 3. State: Preparing -->
      <g class="flow-node" data-title="State: PREPARING" data-badge="State 2" data-desc="Station Admin accepted order. Station personnel sanitizes, fills, and caps water containers. Receipt viewed flag set." data-meta="order_status = 'Preparing', receipt_viewed = 1">
        <rect x="610" y="360" width="180" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="610" y="360" width="180" height="8" rx="4" fill="#7c3aed"/>
        <text x="700" y="398" class="node-title" text-anchor="middle" font-size="14" fill="#6d28d9">PREPARING</text>
        <text x="700" y="416" class="node-subtitle" text-anchor="middle">Accepted by Admin</text>
        <text x="700" y="430" class="node-subtitle" text-anchor="middle">Water Refilling in Progress</text>
      </g>

      <!-- 4. State: To Deliver -->
      <g class="flow-node" data-title="State: TO DELIVER" data-badge="State 3" data-desc="Admin assigned order to Delivery Staff. Status becomes 'To Deliver', creating delivery row in DELIVERIES table. Rider notified." data-meta="order_status = 'To Deliver', INSERT INTO DELIVERIES">
        <rect x="900" y="360" width="180" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="900" y="360" width="180" height="8" rx="4" fill="#2563eb"/>
        <text x="990" y="398" class="node-title" text-anchor="middle" font-size="14" fill="#1d4ed8">TO DELIVER</text>
        <text x="990" y="416" class="node-subtitle" text-anchor="middle">Rider Assigned</text>
        <text x="990" y="430" class="node-subtitle" text-anchor="middle">In Transit to Doorstep</text>
      </g>

      <!-- 5. State: Delivered -->
      <g class="flow-node" data-title="State: DELIVERED (Terminal Success)" data-badge="Terminal State" data-desc="Rider confirms delivery. Empty jugs reconciled or swap-to-borrow debt converted. Loyalty points added, receipt final." data-meta="order_status = 'Delivered', DELIVERIES.delivery_status = 'Completed'">
        <rect x="1210" y="360" width="180" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="1210" y="360" width="180" height="8" rx="4" fill="#10b981"/>
        <text x="1300" y="398" class="node-title" text-anchor="middle" font-size="14" fill="#047857">DELIVERED</text>
        <text x="1300" y="416" class="node-subtitle" text-anchor="middle">Successful Handover</text>
        <text x="1300" y="430" class="node-subtitle" text-anchor="middle">Loyalty Accrued (+2/+3)</text>
      </g>

      <!-- Post Delivery Review -->
      <g class="flow-node" data-title="Customer Review &amp; Rating" data-badge="Feedback" data-desc="Customer rates completed delivery (1 to 5 stars) and submits feedback to station profile." data-meta="INSERT INTO REVIEWS">
        <rect x="1500" y="370" width="160" height="60" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#cardShadow)"/>
        <text x="1580" y="396" class="node-title" text-anchor="middle">Rate &amp; Review</text>
        <text x="1580" y="414" class="node-subtitle" text-anchor="middle">1 to 5 Stars</text>
      </g>

      <!-- State: Cancelled (Terminal Failure) -->
      <g class="flow-node" data-title="State: CANCELLED (Terminal Abort)" data-badge="Terminal State" data-desc="Order was cancelled due to timeout, station rejection, or customer request. Triggers stock replenishment &amp; point refund." data-meta="order_status = 'Cancelled'">
        <rect x="680" y="610" width="180" height="80" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="680" y="610" width="180" height="8" rx="4" fill="#f43f5e"/>
        <text x="770" y="648" class="node-title" text-anchor="middle" font-size="14" fill="#be123c">CANCELLED</text>
        <text x="770" y="666" class="node-subtitle" text-anchor="middle">Terminal Abort State</text>
        <text x="770" y="680" class="node-subtitle" text-anchor="middle">Cannot be reverted</text>
      </g>

      <!-- Atomic Stock & Loyalty Rollback -->
      <g class="flow-node" data-title="Atomic Rollback Process" data-badge="Database Transaction" data-desc="Database replenishes reserved water inventory (stock_level += Qty) and returns redeemed points back to customer balance." data-meta="UPDATE INVENTORY &amp; CUSTOMER_LOYALTY">
        <rect x="650" y="780" width="240" height="80" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="650" y="780" width="240" height="6" rx="3" fill="#e11d48"/>
        <text x="770" y="808" class="node-title" text-anchor="middle" fill="#be123c">Atomic Rollback Execution</text>
        <text x="770" y="826" class="node-subtitle" text-anchor="middle">stock_level = stock_level + Qty</text>
        <text x="770" y="842" class="node-subtitle" text-anchor="middle">points = points + points_used</text>
      </g>

      <!-- State Machine Rule Box -->
      <g transform="translate(1150, 610)">
        <rect width="450" height="250" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)"/>
        <rect width="450" height="32" rx="8" fill="#1e293b"/>
        <rect y="24" width="450" height="8" fill="#1e293b"/>
        <text x="16" y="21" font-size="12" font-weight="700" fill="#ffffff">STATE MACHINE TRANSITION INVARIANTS</text>
        <g transform="translate(16, 55)" font-size="11" fill="#334155">
          <text y="0" font-weight="700">1. Pending &rarr; Preparing | Cancelled</text>
          <text y="18" fill="#64748b">   Only station admin or 5-min timeout can move pending orders.</text>
          
          <text y="46" font-weight="700">2. Preparing &rarr; To Deliver | Cancelled</text>
          <text y="64" fill="#64748b">   Admin assigns staff; order cannot revert to Pending.</text>
          
          <text y="92" font-weight="700">3. To Deliver &rarr; Delivered | Cancelled</text>
          <text y="110" fill="#64748b">   Rider confirms handover; triggers container debt check.</text>
          
          <text y="138" font-weight="700">4. Delivered &amp; Cancelled are TERMINAL</text>
          <text y="156" fill="#e11d48">   Once Delivered or Cancelled, state is strictly immutable.</text>
        </g>
      </g>
    `;

    // Flow views registry
    const views = {
      master: viewMaster,
      ordering: viewOrdering,
      logistics: viewLogistics,
      lifecycle: viewLifecycle
    };

    let currentViewKey = 'master';
    const svgRoot = document.getElementById('svgContentRoot');

    function renderView(viewKey) {
      currentViewKey = viewKey;
      svgRoot.innerHTML = views[viewKey];
      attachNodeEvents();
      resetZoom();
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const viewKey = btn.dataset.view;
        renderView(viewKey);
      });
    });

    // Node Inspector Drawer
    const drawer = document.getElementById('detailsDrawer');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerBadge = document.getElementById('drawerBadge');
    const drawerDesc = document.getElementById('drawerDesc');
    const drawerMeta = document.getElementById('drawerMeta');
    const drawerClose = document.getElementById('drawerClose');

    drawerClose.addEventListener('click', () => {
      drawer.style.display = 'none';
    });

    function attachNodeEvents() {
      document.querySelectorAll('.flow-node').forEach(node => {
        node.addEventListener('click', (e) => {
          e.stopPropagation();
          const title = node.dataset.title || 'Workflow Step';
          const badge = node.dataset.badge || 'System';
          const desc = node.dataset.desc || 'No description available.';
          const meta = node.dataset.meta || '';

          drawerTitle.textContent = title;
          drawerBadge.textContent = badge;
          drawerDesc.textContent = desc;
          drawerMeta.textContent = meta;

          // Color badge based on role
          if (badge.includes('Customer')) {
            drawerBadge.style.background = '#dbeafe';
            drawerBadge.style.color = '#1e40af';
          } else if (badge.includes('Admin')) {
            drawerBadge.style.background = '#f3e8ff';
            drawerBadge.style.color = '#6b21a8';
          } else if (badge.includes('Rider')) {
            drawerBadge.style.background = '#fef3c7';
            drawerBadge.style.color = '#92400e';
          } else if (badge.includes('Database') || badge.includes('ACID')) {
            drawerBadge.style.background = '#e0e7ff';
            drawerBadge.style.color = '#3730a3';
          } else if (badge.includes('Terminal') || badge.includes('Delivered')) {
            drawerBadge.style.background = '#d1fae5';
            drawerBadge.style.color = '#065f46';
          } else {
            drawerBadge.style.background = '#f1f5f9';
            drawerBadge.style.color = '#334155';
          }

          drawer.style.display = 'block';
        });
      });
    }

    // Zoom & Pan Interactivity
    const container = document.getElementById('diagramContainer');
    const svgEl = document.getElementById('flowchartSvg');
    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function updateTransform() {
      svgEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      scale = Math.min(scale + 0.15, 3.0);
      updateTransform();
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      scale = Math.max(scale - 0.15, 0.5);
      updateTransform();
    });

    document.getElementById('btnZoomReset').addEventListener('click', resetZoom);

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(scale * zoomFactor, 0.4), 3.5);
      updateTransform();
    });

    container.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        container.classList.add('grabbing');
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      container.classList.remove('grabbing');
    });

    // Toast
    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3200);
    }

    // Export Utilities
    function getSvgString() {
      const svg = document.getElementById('flowchartSvg');
      return new XMLSerializer().serializeToString(svg);
    }

    // Download Vector SVG
    document.getElementById('btnDownloadSvg').addEventListener('click', () => {
      try {
        const svgText = getSvgString();
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Mababanaba_Waters_Flowchart_${currentViewKey}_16x9.svg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Vector SVG downloaded successfully');
      } catch (err) {
        alert('Could not download SVG: ' + err.message);
      }
    });

    // Rasterize SVG to PNG at target resolution
    function downloadPngAtResolution(width, height, filename) {
      showToast('Rendering ' + width + 'x' + height + ' PNG...');
      try {
        const svgText = getSvgString();
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = new Image();

        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);

          canvas.toBlob((pngBlob) => {
            const pngUrl = URL.createObjectURL(pngBlob);
            const a = document.createElement('a');
            a.href = pngUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(pngUrl);
            showToast('Downloaded ' + filename);
          }, 'image/png');
        };
        img.src = url;
      } catch (err) {
        alert('Could not export PNG: ' + err.message);
      }
    }

    document.getElementById('btnDownloadPng').addEventListener('click', () => {
      downloadPngAtResolution(1920, 1080, `Mababanaba_Waters_Flowchart_${currentViewKey}_1080p.png`);
    });

    document.getElementById('btnDownloadPng4K').addEventListener('click', () => {
      downloadPngAtResolution(3840, 2160, `Mababanaba_Waters_Flowchart_${currentViewKey}_4K_UHD.png`);
    });

    document.getElementById('btnFullscreen').addEventListener('click', () => {
      const container = document.getElementById('diagramContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          alert('Error enabling fullscreen: ' + err.message);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Initial render
    renderView('master');
  </script>
</body>
</html>
