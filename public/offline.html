<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Mababanaba Waters</title>
    <meta name="theme-color" content="#2563eb">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        .icon-wrap {
            width: 80px; height: 80px;
            background: #dbeafe;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .icon-wrap svg { width: 40px; height: 40px; color: #3b82f6; opacity: 0.6; }
        h1 {
            font-size: 28px; font-weight: 900;
            color: #1e293b; letter-spacing: -0.025em;
            margin-bottom: 8px;
        }
        p {
            color: #64748b; font-weight: 500;
            margin-bottom: 32px; max-width: 320px;
            line-height: 1.6; font-size: 15px;
        }
        button {
            padding: 12px 28px;
            background: #2563eb; color: white;
            font-weight: 700; font-size: 15px;
            border: none; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(37,99,235,0.3);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #1d4ed8; }
        button:active { transform: scale(0.95); }
        .brand {
            position: absolute; bottom: 32px;
            font-size: 12px; font-weight: 700;
            color: #94a3b8; letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
            <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>
    <h1>You're offline</h1>
    <p>No internet connection detected. You can still browse previously cached stations and orders.</p>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
        <button onclick="window.location.href='./#customer_dashboard'">Browse Cached Data</button>
        <button onclick="window.location.reload()" style="background:#e2e8f0; color:#334155; box-shadow:none;">Retry Connection</button>
    </div>
    <div class="brand">MABABANABA WATERS</div>
</body>
</html>
