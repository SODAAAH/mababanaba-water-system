<body class="bg-slate-100 text-slate-800 antialiased flex flex-col relative select-none">

    <div id="global-loader" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="loader mb-4"></div>
        <h2 class="text-xl font-black text-blue-600 tracking-wide">Mababanaba Waters</h2>
        <p class="text-sm font-medium text-slate-400 mt-1">Initializing...</p>
    </div>

    <nav class="bg-blue-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 cursor-pointer transition active:scale-95 min-w-0 shrink" onclick="UI.goHome()">
                <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-blue-600 text-lg shadow-sm shrink-0">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <h1 class="text-lg md:text-xl font-black tracking-tight truncate">Mababanaba Waters</h1>
            </div>
            <div id="nav-actions" class="shrink-0"></div>
        </div>
    </nav>

    <div id="pwa-install-banner" class="hidden fixed bottom-4 left-4 right-4 md:left-auto md:bottom-6 md:right-6 md:w-[400px] bg-white border border-slate-200 rounded-2xl p-3 md:p-4 shadow-2xl z-50 transition-all duration-300 slide-in-right flex justify-between items-center">
        <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 bg-white rounded-xl shadow-sm flex items-center justify-center text-blue-600 text-xl shrink-0">
                <i class="fa-solid fa-mobile-screen"></i>
            </div>
            <div class="min-w-0">
                <p class="text-sm font-bold text-slate-800 truncate md:whitespace-normal">Install Mababanaba App</p>
                <p class="text-xs text-slate-500 truncate md:whitespace-normal">For a faster, app-like experience</p>
            </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button onclick="document.getElementById('pwa-install-banner').classList.add('hidden')" class="text-slate-400 p-2 hover:bg-white rounded-full transition"><i class="fa-solid fa-xmark"></i></button>
            <button onclick="App.promptPwaInstall()" class="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-md hover:bg-blue-700 transition active:scale-95">Install</button>
        </div>
    </div>

    <div class="pwa-viewport-frame flex-1">
        <main id="app-root" class="pwa-scroll-canvas"></main>
    </div>

    <div id="proof-modal" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-2 w-full max-w-lg relative shadow-2xl">
            <button onclick="document.getElementById('proof-modal').classList.add('hidden')" class="absolute -top-4 -right-4 w-10 h-10 bg-white text-slate-800 rounded-full shadow-lg flex items-center justify-center text-lg hover:bg-slate-50 transition active:scale-95"><i class="fa-solid fa-xmark"></i></button>
            <div class="overflow-hidden rounded-2xl bg-slate-100 flex items-center justify-center min-h-[300px] max-h-[80vh]">
                <img id="proof-image" src="" alt="Payment Receipt" class="max-w-full max-h-full object-contain">
            </div>
        </div>
    </div>

    <script src="js/state.js?v1788958603836"></script>
